name: Build Android APK

on:
  push:
    branches: [ "feat_projector_merge" ]
  workflow_dispatch: # 允许你在网页端手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat_projector_merge

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.9' # 指定一个特定的、兼容你当前 Gradle 写法的旧版本
          channel: 'stable'
          cache: true    

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-download Gradle
        run: |
          ./android/gradlew --version

      - name: Build APK
        run: flutter build apk --debug # 将 --release 改为 --debug，并去掉 tree-shake 参数

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alclient-tv-debug
          path: build/app/outputs/flutter-apk/app-debug.apk # 注意这里路径也变成了 app-debug.apk
